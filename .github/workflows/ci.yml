name: Foundation CI
on:
  push:
    branches: ["feat/**"]
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:file-budget
# DB RLS tests require Docker/Supabase CLI and are not claimed by this job.

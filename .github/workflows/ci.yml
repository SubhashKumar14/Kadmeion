name: Application and Database CI

on:
  # One CI run per feature change via PR synchronization (no duplicate push job).
  pull_request:
  # Validate the merged result, too, after an explicitly approved merge.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Audit installed production dependency tree for high-severity advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Reject syntax errors in public delivery adapters
        run: node --check api/public-portfolio.mjs && node --check api/reviewer.mjs && node --check api/unlisted.mjs && node --check api/published-identity.mjs
      - run: npm run typecheck
      - run: npm run build:auth
      - run: npm run smoke:auth
      - name: Build and verify isolated auth preview bundle
        run: npm run build:auth:preview && npm run verify:auth:preview
        env:
          VITE_SUPABASE_URL: https://scyooqjitjzjdxgtanso.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_test_only
      - run: npm test
      - name: Validate D01-D90, UI, workflow, case and proof evidence indexes
        run: node scripts/verify-backend-traceability.mjs
      - name: Audit 52 approved LIGHT references and corrected full-screen preview
        run: npm run verify:approved-light
      - run: npm run check:file-budget
      # B07 release smoke uses no JWTs, accounts, secrets or mutating RPCs.
      # PR-only: main's isolated code CI remains independent of paused free hosting.
      - name: Hosted B07 Edge deny-by-default HTTP smoke
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/b0-backend-foundation'
        timeout-minutes: 2
        run: |
          node --input-type=module <<'NODE'
          const base='https://scyooqjitjzjdxgtanso.supabase.co/functions/v1/';
          async function denied(slug,method,expected){
            const r=await fetch(base+slug,{
              method,redirect:'error',signal:AbortSignal.timeout(12000),
              headers:{Accept:'application/json',
                ...(method==='POST'?{'Content-Type':'application/json'}:{})},
              ...(method==='POST'?{body:'{}'}:{})
            });
            const body=await r.text();
            if(!expected.includes(r.status)){
              throw Error(slug+' '+method+' unexpected HTTP '+r.status+
                ' body='+body.slice(0,120).replace(/[\r\n]/g,' '));
            }
            console.log(slug,method,'HTTP',r.status,'denied by default');
          }
          // Unauthenticated reads cannot expose an owner-only worker.
          await denied('publish','POST',[401,403]);
          await denied('complete-private-asset','POST',[401,403]);
          // The no-JWT scheduler must reach its handler but never run a sweep
          // without the separate disabled feature flag and trusted secret.
          await denied('purge-expired-trash','GET',[405]);
          await denied('purge-expired-trash','POST',[401,404]);
          NODE

  database:
    # Every GitHub-hosted runner is isolated, including localhost ports.
    # Only the newest PR synchronization needs an ephemeral Supabase proof;
    # do not queue and spend free Actions minutes on obsolete branch revisions.
    concurrency:
      group: kd-ephemeral-db-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 3.1.0
      - name: Start isolated Supabase, retry one port collision
        shell: bash
        run: |
          log=$(mktemp)
          trap 'rm -f "$log"' EXIT
          for attempt in 1 2; do
            if supabase start >"$log" 2>&1; then
              cat "$log"
              exit 0
            fi
            cat "$log"
            result=$(<"$log")
            if [[ "$attempt" == 2 || "$result" != *"address already in use"* ||
                  "$result" != *"failed to bind host port"* ]]; then
              exit 1
            fi
            sleep 10
          done
      - run: supabase test db
      - name: Lint PL/pgSQL definitions in isolated database
        run: supabase db lint --schema public,kadmeion_private --level error --fail-on error
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Exercise authenticated React workflows against the isolated Supabase stack
        run: |
          npm ci --prefix apps/frontend --ignore-scripts --no-fund
          credentials="$(supabase status -o env)"
          VITE_SUPABASE_PUBLISHABLE_KEY="$(sed -n 's/^ANON_KEY="\(.*\)"$/\1/p' <<<"$credentials")"
          KADMEION_TEST_SERVICE_ROLE_KEY="$(sed -n 's/^SERVICE_ROLE_KEY="\(.*\)"$/\1/p' <<<"$credentials")"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          test -n "$KADMEION_TEST_SERVICE_ROLE_KEY"
          export VITE_SUPABASE_PUBLISHABLE_KEY KADMEION_TEST_SERVICE_ROLE_KEY
          unset credentials
          npm run test:e2e --prefix apps/frontend -- owner.spec.ts
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          KADMEION_LOCAL_BROWSER: '1'
          KADMEION_BROWSER_CAPTURE_DIR: /tmp/kadmeion-owner-captures
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: kadmeion-owner-browser-captures
          path: /tmp/kadmeion-owner-captures/*.png
          if-no-files-found: ignore
          retention-days: 1
      - name: Test real GoTrue + PostgREST + private Storage over HTTP
        run: node --experimental-strip-types --test tests/integration/local-supabase-http.test.mjs
        env:
          KADMEION_LOCAL_INTEGRATION: '1'
      - name: Smoke test real local Supabase Deno Edge attestation gateway
        run: node --test tests/integration/local-private-asset-edge.test.mjs
        env:
          KADMEION_LOCAL_INTEGRATION: '1'
      - name: Smoke test real owner-JWT publication Edge gateway
        run: node --test tests/integration/local-publish-edge.test.mjs
        env:
          KADMEION_LOCAL_INTEGRATION: '1'
      - name: Test local signup confirmation and recovery through Mailpit
        run: node --test tests/integration/local-auth-email.test.mjs
        env:
          KADMEION_LOCAL_INTEGRATION: '1'
      - name: Test restricted direct PostgreSQL artifact binding (local only)
        run: node --experimental-strip-types --test tests/integration/local-postgres-binding.test.mjs
        env:
          KADMEION_LOCAL_INTEGRATION: '1'
      - name: Test operator moderation hold against real pg.Pool races (local only)
        run: node --experimental-strip-types --test tests/integration/local-moderation-binding-race.test.mjs
        env:
          KADMEION_LOCAL_INTEGRATION: '1'
# Only an ephemeral local Supabase stack: no cloud secrets, no production writes.

name: Application and Database CI

on:
  push:
    branches: ["feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:auth
      - run: npm run smoke:auth
      - name: Build and verify isolated auth preview bundle
        run: npm run build:auth:preview && npm run verify:auth:preview
        env:
          VITE_SUPABASE_URL: https://scyooqjitjzjdxgtanso.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_test_only
      - run: npm test
      - run: npm run check:file-budget

  database:
    # Supabase CLI uses fixed localhost ports; serialize database jobs across
    # push/PR runs so overlapping runs cannot race for 54321/54322.
    concurrency:
      group: kadmeion-ephemeral-supabase-database
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - run: supabase start
      - run: supabase test db
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Test real GoTrue + PostgREST + private Storage over HTTP
        run: node --experimental-strip-types --test tests/integration/local-supabase-http.test.mjs
        env:
          KADMEION_LOCAL_INTEGRATION: '1'
      - name: Test restricted direct PostgreSQL artifact binding (local only)
        run: node --experimental-strip-types --test tests/integration/local-postgres-binding.test.mjs
        env:
          KADMEION_LOCAL_INTEGRATION: '1'
      - name: Test operator moderation hold against real pg.Pool races (local only)
        run: node --experimental-strip-types --test tests/integration/local-moderation-binding-race.test.mjs
        env:
          KADMEION_LOCAL_INTEGRATION: '1'
# Only an ephemeral local Supabase stack: no cloud secrets, no production writes.

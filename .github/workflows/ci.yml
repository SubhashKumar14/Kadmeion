name: Application and Database CI

on:
  # One CI run per feature change via PR synchronization (no duplicate push job).
  pull_request:
  # Validate the merged result, too, after an explicitly approved merge.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Temporary lockfile capture on isolated branch for a reproducible
      # runtime/compiler major-version upgrade; remove after lock is committed.
      - name: Resolve and output lockfile for review (temporary)
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e 'console.log("KADMEION_LOCK_BEGIN"+JSON.stringify(JSON.parse(require("node:fs").readFileSync("package-lock.json","utf8")))+"KADMEION_LOCK_END")'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:auth
      - run: npm run smoke:auth
      - name: Build and verify isolated auth preview bundle
        run: npm run build:auth:preview && npm run verify:auth:preview
        env:
          VITE_SUPABASE_URL: https://scyooqjitjzjdxgtanso.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_test_only
      - run: npm test
      - run: npm run check:file-budget

  database:
    # Supabase CLI uses fixed localhost ports; serialize database jobs across
    # push/PR runs so overlapping runs cannot race for 54321/54322.
    concurrency:
      group: kadmeion-ephemeral-supabase-database
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 3.1.0
      - run: supabase start
      - run: supabase test db
      - name: Lint PL/pgSQL definitions in isolated database
        run: supabase db lint --schema public,kadmeion_private --level error --fail-on error
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Test real GoTrue + PostgREST + private Storage over HTTP
        run: node --experimental-strip-types --test tests/integration/local-supabase-http.test.mjs
        env:
          KADMEION_LOCAL_INTEGRATION: '1'
      - name: Smoke test real local Supabase Deno Edge attestation gateway
        run: node --test tests/integration/local-private-asset-edge.test.mjs
        env:
          KADMEION_LOCAL_INTEGRATION: '1'
      - name: Smoke test real owner-JWT publication Edge gateway
        run: node --test tests/integration/local-publish-edge.test.mjs
        env:
          KADMEION_LOCAL_INTEGRATION: '1'
      - name: Test local signup confirmation and recovery through Mailpit
        run: node --test tests/integration/local-auth-email.test.mjs
        env:
          KADMEION_LOCAL_INTEGRATION: '1'
      - name: Test restricted direct PostgreSQL artifact binding (local only)
        run: node --experimental-strip-types --test tests/integration/local-postgres-binding.test.mjs
        env:
          KADMEION_LOCAL_INTEGRATION: '1'
      - name: Test operator moderation hold against real pg.Pool races (local only)
        run: node --experimental-strip-types --test tests/integration/local-moderation-binding-race.test.mjs
        env:
          KADMEION_LOCAL_INTEGRATION: '1'
# Only an ephemeral local Supabase stack: no cloud secrets, no production writes.

name: Application and Database CI

on:
  pull_request:
  # The ongoing feature branch must also be checked after PR #1 closed.
  push:
    branches: [main, 'feat/b0-backend-foundation']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # pinned B16 file-budget baseline must be available
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Report B16 counted files and enforce exact authorized paths
        run: npm run check:file-budget
      - name: Verify R7 conditional ceiling and exact reservations with isolated Git index
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync, spawnSync } from 'node:child_process';
          import { mkdtempSync, readFileSync, writeFileSync, rmSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          import assert from 'node:assert/strict';
          const temp=mkdtempSync(join(tmpdir(),'kadmeion-budget-'));
          const env={...process.env,GIT_INDEX_FILE:join(temp,'index')};
          const git=(args,options={})=>execFileSync('git',args,{env,encoding:'utf8',...options}).trim();
          const gate='scripts/check-file-budget.mjs';
          const source=readFileSync(gate,'utf8');
          const marker='const authorizedAdditionPaths = [';
          assert.equal(source.split(marker).length,2);
          const counted=p=>p!=='README.md'&&!['project-docs/','node_modules/','dist/','coverage/'].some(x=>p.startsWith(x));
          const run=(file,ok,pattern)=>{
            const r=spawnSync(process.execPath,[file],{env,encoding:'utf8',timeout:10000});
            assert.equal(r.error,undefined);
            assert.equal(r.status,ok?0:1,r.stdout+r.stderr);
            assert.match(r.stdout+r.stderr,pattern);
            console.log((ok?'PASS ':'EXPECTED DENIAL ')+r.stdout.trim()+(ok?'':' '+r.stderr.trim()));
          };
          const fixture=(name,paths)=>{
            const file=join(temp,name+'.mjs');
            writeFileSync(file,source.replace(marker,marker+'\n'+paths.map(p=>JSON.stringify(p)+',').join('\n')));
            return file;
          };
          try{
            git(['read-tree','HEAD']);
            const baseline=git(['ls-files','--cached']).split('\n').filter(counted);
            const ceiling=282;
            assert.ok(baseline.length<=ceiling);
            const extras=Array.from({length:ceiling-baseline.length},(_,i)=>`tests/__b16_budget_fixture__/case-${i}.test.ts`);
            const over='tests/__b16_budget_fixture__/over-limit.test.ts';
            const excluded='project-docs/__b16_budget_fixture__/excluded.txt';
            const blob=git(['hash-object','-w','--stdin'],{input:''});
            const add=p=>git(['update-index','--add','--cacheinfo','100644,'+blob+','+p]);
            run(gate,true,/R7 conditional ceiling: 282/);
            add(excluded);
            run(gate,true,new RegExp('files: '+baseline.length+' /'));
            for(const p of extras)add(p);
            const total=baseline.length+extras.length;
            assert.equal(total,ceiling);
            // Only scratch copies have synthetic authorization; never change the real allowlist.
            run(fixture('authorized-at-ceiling',extras),true,new RegExp('files: '+total+' /'));
            add(over);
            run(fixture('unregistered-over',extras),false,/Unreserved counted additions/);
            run(fixture('authorized-over-ceiling',[...extras,over]),false,/R7 conditional file ceiling exceeded/);
            git(['update-index','--force-remove',over]);
            run(fixture('duplicate-authorization',[...extras,over,over]),false,/Colliding counted-path authorizations/);
            run(fixture('baseline-collision',[...extras,gate]),false,/Colliding counted-path authorizations/);
            console.log('R7: 7/7 isolated index checks passed; real allowlist unchanged.');
          }finally{rmSync(temp,{recursive:true,force:true});}
          NODE
      - name: Mandatory C03 method-aware delivery and bounded cancellation regressions
        run: node --experimental-strip-types --test --test-timeout=30000 tests/editor/unlisted-release-verification.test.ts
      - name: Audit installed production dependency tree for high-severity advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Reject syntax errors in public delivery adapters
        run: node --check api/public-portfolio.mjs && node --check api/reviewer.mjs && node --check api/unlisted.mjs && node --check api/published-identity.mjs
      - run: npm run typecheck
      - run: npm run build:auth
      - run: npm run smoke:auth
      - name: Build and verify isolated auth preview bundle
        run: npm run build:auth:preview && npm run verify:auth:preview
        env:
          VITE_SUPABASE_URL: https://scyooqjitjzjdxgtanso.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_test_only
      - name: Focused batch04 independent successor contract suites
        id: focused_successors
        run: node --experimental-strip-types --test --test-timeout=90000 tests/auth-web/supabase-auth-port.test.ts tests/contracts/private-goals-service.test.ts tests/contracts/private-moderation-service.test.ts tests/editor/host-revocation-probe.test.ts tests/editor/private-account-data-export.test.ts
        env:
          KADMEION_REQUIRE_REAUTH_CANDIDATE: '1'
      - run: npm test
        if: ${{ success() || (!cancelled() && steps.focused_successors.outcome == 'failure') }}
        env:
          KADMEION_REQUIRE_REAUTH_CANDIDATE: '1'
      - name: Validate D01-D90, UI, workflow, case and proof evidence indexes
        run: node scripts/verify-backend-traceability.mjs
      - name: Audit 52 approved LIGHT references and corrected full-screen preview
        run: npm run verify:approved-light
      - name: Validate F0 source to owner-action and brand contract
        run: npm run verify:f0
      # B07 release smoke uses no JWTs, accounts, secrets or mutating RPCs.
      # PR-only: main's isolated code CI remains independent of paused free hosting.
      - name: Hosted B07 Edge deny-by-default HTTP smoke
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/b0-backend-foundation'
        timeout-minutes: 2
        run: |
          node --input-type=module <<'NODE'
          const base='https://scyooqjitjzjdxgtanso.supabase.co/functions/v1/';
          async function denied(slug,method,expected){
            const r=await fetch(base+slug,{
              method,redirect:'error',signal:AbortSignal.timeout(12000),
              headers:{Accept:'application/json',
                ...(method==='POST'?{'Content-Type':'application/json'}:{})},
              ...(method==='POST'?{body:'{}'}:{})
            });
            const body=await r.text();
            if(!expected.includes(r.status)){
              throw Error(slug+' '+method+' unexpected HTTP '+r.status+
                ' body='+body.slice(0,120).replace(/[\r\n]/g,' '));
            }
            console.log(slug,method,'HTTP',r.status,'denied by default');
          }
          // Unauthenticated reads cannot expose an owner-only worker.
          await denied('publish','POST',[401,403]);
          await denied('complete-private-asset','POST',[401,403]);
          // The no-JWT scheduler must reach its handler but never run a sweep
          // without the separate disabled feature flag and trusted secret.
          await denied('purge-expired-trash','GET',[405]);
          await denied('purge-expired-trash','POST',[401,404]);
          NODE

  database:
    # Every GitHub-hosted runner is isolated, including localhost ports.
    # Only the newest PR synchronization needs an ephemeral Supabase proof;
    # do not queue and spend free Actions minutes on obsolete branch revisions.
    concurrency:
      group: kd-ephemeral-db-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 3.1.0
      - name: Reserve local Supabase ports on the ephemeral runner
        shell: bash
        run: |
          # Supabase publishes fixed ports inside Linux's ephemeral range.
          # Preserve any existing reservations on this GitHub-hosted runner.
          reserved=$(sysctl -n net.ipv4.ip_local_reserved_ports)
          sudo sysctl -q -w "net.ipv4.ip_local_reserved_ports=${reserved:+$reserved,}54320-54329"
      - name: Start isolated Supabase, retry one port collision
        shell: bash
        run: |
          log=$(mktemp)
          trap 'rm -f "$log"' EXIT
          for attempt in 1 2; do
            if supabase start >"$log" 2>&1; then
              cat "$log"
              exit 0
            fi
            cat "$log"
            result=$(<"$log")
            if [[ "$result" != *"address already in use"* ||
                  "$result" != *"failed to bind host port"* ]]; then
              exit 1
            fi
            sudo ss -ltnp | awk '$4 ~ /:5432[0-9]$/'
            if [[ "$attempt" == 2 ]]; then
              exit 1
            fi
            # Only this ephemeral CI project. Remove partially started
            # local Docker containers before the second attempt. NEVER target
            # hosted Supabase or other projects.
            supabase stop --no-backup >/dev/null 2>&1 || true
            sleep 10
          done
      - run: supabase test db
      - name: Lint PL/pgSQL definitions in isolated database
        run: supabase db lint --schema public,kadmeion_private --level error --fail-on error
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        id: isolated_db_ready
      - name: Exercise authenticated React workflows against the isolated Supabase stack
        run: |
          npm ci --prefix apps/frontend --ignore-scripts --no-fund
          credentials="$(supabase status -o env)"
          VITE_SUPABASE_PUBLISHABLE_KEY="$(sed -n 's/^ANON_KEY="\(.*\)"$/\1/p' <<<"$credentials")"
          KADMEION_TEST_SERVICE_ROLE_KEY="$(sed -n 's/^SERVICE_ROLE_KEY="\(.*\)"$/\1/p' <<<"$credentials")"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          test -n "$KADMEION_TEST_SERVICE_ROLE_KEY"
          export VITE_SUPABASE_PUBLISHABLE_KEY KADMEION_TEST_SERVICE_ROLE_KEY
          unset credentials
          npm run test:e2e --prefix apps/frontend -- owner.spec.ts settings-owner.spec.ts
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          KADMEION_LOCAL_BROWSER: '1'
          VITE_KADMEION_EMAIL_DELIVERY_VERIFIED: 'true'
          KADMEION_BROWSER_CAPTURE_DIR: /tmp/kadmeion-owner-captures
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: kadmeion-owner-browser-captures
          path: |
            /tmp/kadmeion-owner-captures/*.png
            /tmp/kadmeion-owner-captures/*.a11y.json
            /tmp/kadmeion-owner-captures/*.route-diagnostics.json
          if-no-files-found: ignore
          retention-days: 1
      - name: Test real GoTrue + PostgREST + private Storage over HTTP
        if: ${{ !cancelled() && steps.isolated_db_ready.outcome == 'success' }}
        run: node --experimental-strip-types --test tests/integration/local-supabase-http.test.mjs
        env:
          KADMEION_LOCAL_INTEGRATION: '1'
      - name: Smoke test real local Supabase Deno Edge attestation gateway
        if: ${{ !cancelled() && steps.isolated_db_ready.outcome == 'success' }}
        run: node --test tests/integration/local-private-asset-edge.test.mjs
        env:
          KADMEION_LOCAL_INTEGRATION: '1'
      - name: Smoke test real owner-JWT publication Edge gateway
        if: ${{ !cancelled() && steps.isolated_db_ready.outcome == 'success' }}
        run: node --test tests/integration/local-publish-edge.test.mjs
        env:
          KADMEION_LOCAL_INTEGRATION: '1'
      - name: Test local immediate signup and recovery through Mailpit
        if: ${{ !cancelled() && steps.isolated_db_ready.outcome == 'success' }}
        run: node --test tests/integration/local-auth-email.test.mjs
        env:
          KADMEION_LOCAL_INTEGRATION: '1'
      - name: Test restricted direct PostgreSQL artifact binding (local only)
        if: ${{ !cancelled() && steps.isolated_db_ready.outcome == 'success' }}
        run: node --experimental-strip-types --test tests/integration/local-postgres-binding.test.mjs
        env:
          KADMEION_LOCAL_INTEGRATION: '1'
      - name: Test operator moderation hold against real pg.Pool races (local only)
        if: ${{ !cancelled() && steps.isolated_db_ready.outcome == 'success' }}
        run: node --experimental-strip-types --test tests/integration/local-moderation-binding-race.test.mjs
        env:
          KADMEION_LOCAL_INTEGRATION: '1'
# Only an ephemeral local Supabase stack: no cloud secrets, no production writes.

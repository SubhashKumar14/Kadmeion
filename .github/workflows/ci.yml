name: Application and Database CI

on:
  push:
    branches: ["feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:auth
      - run: npm run smoke:auth
      - name: Build and verify isolated auth preview bundle
        run: npm run build:auth:preview && npm run verify:auth:preview
        env:
          VITE_SUPABASE_URL: https://scyooqjitjzjdxgtanso.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_test_only
      - run: npm test
      - run: npm run check:file-budget

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase test db
# Only an ephemeral local Supabase stack: no cloud secrets, no production writes.

name: Frontend React 19 + Vite 8 verification
on:
  push:
    branches: ['feat/b0-backend-foundation']
    paths:
      - 'apps/frontend/**'
      - 'apps/auth-web/**'
      - 'packages/contracts/**'
      - 'packages/editor-core/**'
      - 'packages/storage-adapters/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.1'
      - name: Pin npm to repository-stated release
        run: npm install --global npm@12.2.2 --no-fund
      - name: Resolve exact-version lockfile without package lifecycle scripts
        run: npm install --prefix apps/frontend --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install from the resolved lockfile
        run: npm ci --prefix apps/frontend --ignore-scripts --no-fund
      - name: Verify types, behavior, and production bundle
        run: |
          npm run typecheck --prefix apps/frontend
          npm test --prefix apps/frontend
          npm run build --prefix apps/frontend
      - name: Exercise real browser interactions in Chrome (latest stable Playwright)
        run: npm run test:e2e --prefix apps/frontend
        env:
          CI: 'true'
      - name: Audit production dependency advisories
        run: npm audit --prefix apps/frontend --omit=dev --audit-level=high
      - name: Capture real Chromium browser screenshots for F1 LIGHT comparison
        run: |
          npm run preview --prefix apps/frontend -- --host 127.0.0.1 > /tmp/kadmeion-preview.log 2>&1 &
          for n in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          BROWSER="$(command -v google-chrome || command -v chromium)"
          test -n "$BROWSER"
          mkdir -p /tmp/kadmeion-f1-browser
          while read -r screen route; do
            "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1534,960 --virtual-time-budget=1000 \
              --screenshot="/tmp/kadmeion-f1-browser/${screen}_BROWSER.png" "http://127.0.0.1:4173$route"
          done <<'ROUTES'
          01_LANDING /
          02_EXPLORE /explore
          03_TEMPLATES /templates
          04_SIGNIN /signin
          05_SIGNUP /signup
          06_CALLBACK /auth/callback?code=invalid-capture-example
          07_RECOVERY /forgot-password
          08_RESET /reset-password
          09_RECOVERY_STATUS /auth/recovery-status
          51_UNAVAILABLE /missing-public-page
          ROUTES
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: kadmeion-f1-browser-captures
          path: /tmp/kadmeion-f1-browser/*.png
          if-no-files-found: warn
          retention-days: 1
      - name: Commit reproducible frontend lockfile only after green checks
        if: github.ref == 'refs/heads/feat/b0-backend-foundation'
        run: |
          git add apps/frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build(frontend): pin reproducible React 19 and Vite 8 lockfile'
            git push origin HEAD:feat/b0-backend-foundation
          fi


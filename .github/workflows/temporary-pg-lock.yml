name: Temporary locked pg dependency resolution
on:
  push:
    branches: ["feat/b0-backend-foundation"]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Resolve pinned pg without modifying remote repository
        run: npm install --package-lock-only --save-exact pg@8.23.1 --workspace=@kadmeion/storage-adapters --ignore-scripts --no-audit --no-fund
      - name: Resolve matching TypeScript declarations for Node 22
        run: npm install --package-lock-only --save-exact --save-dev @types/pg@8.23.1 @types/node@22.20.5 --ignore-scripts --no-audit --no-fund
      - name: Emit nonsecret package manifests for controlled follow-up commit
        run: |
          echo KADMEION_LOCK_START
          base64 -w0 package-lock.json
          echo
          echo KADMEION_LOCK_END
          echo KADMEION_WORKSPACE_START
          base64 -w0 packages/storage-adapters/package.json
          echo
          echo KADMEION_WORKSPACE_END
          echo KADMEION_ROOT_START
          base64 -w0 package.json
          echo
          echo KADMEION_ROOT_END
